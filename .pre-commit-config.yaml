repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # results/paper-v1/ holds VERBATIM copies of the files that produced the v1
      # tables; a hook that strips a trailing blank line breaks the byte-identity
      # the archive exists to guarantee (docs/plan/cleanup/paper-source-map.md).
      - id: trailing-whitespace
        exclude: ^results/paper-v1/
      - id: end-of-file-fixer
        exclude: ^results/paper-v1/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^results/.*\.jsonl(\.gz)?$   # records are the repo's data artifacts (gz'd when large); tensors/checkpoints stay guarded
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Run mypy from the project venv so it sees the real (typed) transformers /
      # torch / numpy, not an isolated env where they collapse to Any. Keeps
      # pre-commit, CI, and local `mypy` consistent.
      - id: mypy
        name: mypy (project venv, strict)
        entry: uv run mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
