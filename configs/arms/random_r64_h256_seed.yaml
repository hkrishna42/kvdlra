doc: >-
  Gate-1 floor control (L3.1): fixed Haar-random orthonormal basis -- one seeded draw per
  layer and per stream (basis_seed + 2*layer_idx, +1 for V), never updated, so no data
  ever enters the gist. Everything else is isvd_r64_h256_seed verbatim, which makes this
  cell what the rank-64 storage, the 256-token exact tier, the sinks and the ring are
  worth with no subspace tracking at all.
