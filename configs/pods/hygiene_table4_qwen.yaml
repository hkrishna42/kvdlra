name: hygiene_table4_qwen
model: "Qwen/Qwen2.5-7B-Instruct"
dtype: bfloat16
doc: >-
  ICML plan 0.1 on the cell that diverged (Qwen r=256, ppl 27531 at ee8c0ab): rank in {128, 256}
  x orthonormality guard in {off, tolerance, thin QR every 64 absorbs} x singular-value floor in
  {off, 1e-2}, plus the uncompressed reference. Perplexity on PG-19 validation at 16K over 32
  non-overlapping windows decides whether the guard ALONE removes the divergence, which in turn
  decides whether the paper's mechanism section says "orthonormality ratchet" or "rank
  siphoning"; the in-house 16K retrieval task carries the neutrality check at r128. Every gist
  arm sets diag_every 4096 so each sample leaves one summary [diag] row per layer and the whole
  run fits the watchdog's 30000-line fetch -- the arithmetic is in the prereg. The prereg also
  states the per-arm prediction, the decision rule and the Holm family; launch is the owner's
  call (DECISIONS D-011) and must be a commit that descends from the prereg's.
prereg: prereg/hygiene_table4.md
arms: ["isvd_r128_noguard", "isvd_r128_tol", "isvd_r128_qr64", "isvd_r128_f0.01_tol",
       "isvd_r128_f0.01_qr64", "isvd_r256_noguard", "isvd_r256_tol", "isvd_r256_qr64",
       "isvd_r256_f0.01_tol", "isvd_r256_f0.01_qr64", "full"]
tasks: ["ppl_16k_pg19val", "ruler_inhouse_16k"]
image: "pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel"
gpu_budget_h: 4.0
