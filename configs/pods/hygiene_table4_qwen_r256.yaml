name: hygiene_table4_qwen_r256
model: "Qwen/Qwen2.5-7B-Instruct"
dtype: bfloat16
doc: >-
  ICML plan 0.1 on the cell that diverged (Qwen r=256, ppl 27531 at ee8c0ab): orthonormality
  guard in {off, tolerance, thin QR every 64 absorbs} x singular-value floor in {off, 1e-2},
  minus the floor-on unguarded cells, plus the uncompressed reference. Perplexity on PG-19
  validation at 16K over 16 non-overlapping windows decides whether the guard ALONE removes
  the divergence, which in turn decides whether the paper's mechanism section says
  "orthonormality ratchet" or "rank siphoning". This pod carries all three members of the
  Holm family that read Qwen; the r128 rows moved to hygiene_table4_qwen_r128 so the two
  ranks run in parallel, and `full` is in both halves so every pairing stays inside one pod
  (prereg/hygiene_table4.md Amendment 1, DECISIONS D-011 addendum 2). The retrieval task is
  not here: the neutrality secondary is deferred to a follow-up pod. Every gist arm sets
  diag_every 4096, so each sample leaves one summary [diag] row per layer -- the arithmetic
  is in the prereg. The prereg also states the per-arm prediction, the decision rule and the
  Holm family; launch is the owner's call (DECISIONS D-011) and must be a commit that
  descends from the prereg's.
prereg: prereg/hygiene_table4.md
arms: ["isvd_r256_noguard", "isvd_r256_tol", "isvd_r256_qr64", "isvd_r256_f0.01_tol",
       "isvd_r256_f0.01_qr64", "full"]
tasks: ["ppl_16k_pg19val_w16"]
image: "pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel"
gpu_budget_h: 7.0
