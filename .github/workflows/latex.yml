name: paper

on:
  push:
    branches: [main, week7]
    paths: ["paper/**", ".github/workflows/latex.yml"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

jobs:
  build:
    name: build paper/main.pdf (latexmk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with latexmk (pdflatex + bibtex)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -bibtex -interaction=nonstopmode -file-line-error
      - name: Fail on undefined references or citations
        working-directory: paper
        run: |
          if grep -E "Warning: (Citation|Reference) .* undefined|There were undefined" main.log; then
            echo "::error::undefined references/citations"; exit 1; fi
          grep -c "Overfull \\\\hbox" main.log | xargs -I{} echo "overfull hboxes: {}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: paper/main.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main.log
          path: paper/main.log
