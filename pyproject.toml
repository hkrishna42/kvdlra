[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvdlra"
version = "0.1.0"
description = "Online low-rank KV-cache compression for LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hari Krishnan", email = "harikrishnangirikumar@gmail.com" }]
dependencies = [
  "torch==2.11.0",
  "transformers==5.8.0",
  "datasets==2.21.0",  # substituted: 4.8.5 -> 2.21.0 (kvpress==0.5.1 caps datasets>=2.21.0,<3)
  "kvpress==0.5.1",
  "optimum-quanto>=0.2.7",  # KIVI-style 2/4-bit QuantizedCache baseline arm
  "omegaconf>=2.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "hqq==0.2.8.post1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3", "pytest-cov",
  "ruff==0.15.12", "mypy==2.0.0", "pre-commit",
  # torch's C++ extension loader shells out to the `ninja` EXECUTABLE; without it
  # optimum-quanto cannot JIT its kernel and the quant tests fail on a clean clone.
  "ninja",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kvdlra"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4"]

[tool.ruff.lint.per-file-ignores]
# Numerical code follows the source papers' notation (U, S, V, B, F, K, L, Y).
# pep8-naming (N802/N803/N806) would force unreadable lowercase; waiver is
# scoped to the math modules and their tests, where matching the paper matters.
"src/kvdlra/tracker/*" = ["N802", "N803", "N806"]
"src/kvdlra/quant/*" = ["N802", "N803", "N806"]
"tests/*" = ["N802", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Resolve ``kvdlra`` from src/ deterministically -- the hatchling editable .pth is
# flaky on this Mac (handover §6), so scripts importing new submodules (e.g.
# kvdlra.accounting) would otherwise fail mypy intermittently. Mirrors pytest's
# pythonpath=["src"].
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["kvpress.*", "transformers.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
# `--strict-markers` refuses an undeclared marker, so the one the suite is allowed to
# use is declared here. Nothing carries it yet: the CPU suite is a 90-second gate.
markers = ["slow: loads a model or runs a long sweep; deselect with -m 'not slow'"]
# src layout: import kvdlra from src/ even if the editable install's import hook
# is dropped by an env re-sync. No-op when the package is properly installed.
# scripts/ is on the path so the entrypoint tests can `import pod` / `import tables`
# and exercise the modules directly rather than through a subprocess.
pythonpath = ["src", "scripts"]
