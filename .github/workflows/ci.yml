name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + typecheck + tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtualenv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install CPU torch
        # Pin to the CPU wheel so CI doesn't pull the multi-GB CUDA build.
        run: uv pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev extras)
        run: uv pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest -q
