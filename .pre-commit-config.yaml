repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Run mypy from the project venv so it sees the real (typed) transformers /
      # torch / numpy, not an isolated env where they collapse to Any. Keeps
      # pre-commit, CI, and local `mypy` consistent.
      - id: mypy
        name: mypy (project venv, strict)
        entry: uv run mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
