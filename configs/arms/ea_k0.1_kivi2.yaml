name: ea_k0.1_kivi2
legacy_name: "ea-k0.1-q2-kivi"
kind: composite
chunkable: false
doc: >-
  MiniKV-style composite: ExpectedAttention prunes to 0.1 of the tokens and the survivors are
  stored at 2 bits (KIVI grouping). The two compression axes multiply, so this is the
  byte-matched competitor for the sub-cliff cell. The press runs single-shot.
press:
  keep: 0.1
quant:
  nbits: 2
  scheme: "kivi"
  backend: "quanto"
  group: 64
  residual: 128
