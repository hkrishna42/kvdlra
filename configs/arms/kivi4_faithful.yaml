name: kivi4_faithful
kind: quant_faithful
chunkable: false
doc: >-
  KIVI's published operating point (Liu et al. 2024) at 4 bits: per-channel keys, per-token values,
  G=32, R=128, full-precision prefill; quanto backend — no fused 4-bit kernel, so decode dequantizes
  (deviation recorded)
quant:
  nbits: 4
  scheme: "kivi"
  backend: "quanto"
  group: 32
  residual: 128
