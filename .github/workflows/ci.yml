name: CI

on:
  push:
    branches: [main, week7]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + typecheck + tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_pod_manifest.py walks it to enforce the rule that a
          # pre-registration is committed BEFORE the pod it registers. A shallow clone
          # has no ancestors to walk (the test skips itself there, which would retire
          # the rule in the one place it is checked automatically).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtualenv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install CPU torch
        # Pin to the CPU wheel so CI doesn't pull the multi-GB CUDA build.
        run: uv pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev extras)
        run: uv pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src tests scripts

      # Through `make`, not bare pytest: the Makefile puts the venv's bin/ on PATH,
      # and torch's C++ extension loader shells out to the `ninja` EXECUTABLE -- the
      # quant tests fail to JIT without it. `uv run` resolves the same venv.
      - name: Pytest
        run: make test PY="uv run python"

      # The two generated artifacts are part of the gate: `make tables` rebuilds every
      # paper table from results/paper-v1 and diffs it against docs/plan/paper-v1-tables.md
      # (a number that no longer regenerates fails here), and `make figures` proves the
      # figure scripts still run against the archive.
      - name: Tables (regenerate + diff vs paper-v1)
        run: make tables PY="uv run python"

      - name: Figures
        run: make figures PY="uv run python"

      # Every committed manifest through the gate a citable number has to pass. Today
      # that is the paper-v1 archive (recognised and skipped) plus whatever a lane
      # commits next -- so the rule is exercised in CI from the first real pod, not
      # first discovered to be broken by the pod that needs it.
      - name: Check (every committed manifest)
        run: make check PY="uv run python"
